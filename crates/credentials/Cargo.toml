[package]
name = "statewright-credentials"
description = "Cross-platform OS credential-store helper for Statewright gateway tokens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "statewright_credentials"
path = "src/lib.rs"

[[bin]]
name = "statewright-credentials"
path = "src/main.rs"

[dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
