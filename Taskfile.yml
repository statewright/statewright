version: '3'

vars:
  CARGO: "{{.HOME}}/.cargo/bin/cargo"

tasks:
  plugins:sync-error-reporting:
    desc: "Refresh the privacy-safe Sentry reporter shipped with each Node plugin"
    cmds:
      - node plugins/executor/scripts/sync-error-reporting.mjs
      - npm run build --prefix plugins/omx
      - node plugins/executor/scripts/sync-error-reporting.mjs --check
      - npm test --prefix plugins/omx -- --run tests/error-reporting-bundle.spec.ts

  plugins:sync-executor-core:
    desc: "Refresh the Codex marketplace copy of the shared executor core"
    cmds:
      - node plugins/codex/scripts/sync-executor-core.mjs
      - node plugins/codex/scripts/sync-executor-core.mjs --check

  plugins:sync-claude-managed-client:
    desc: "Refresh the Claude marketplace bundle for transparent managed routing"
    cmds:
      - node plugins/claude-code/scripts/sync-managed-client.mjs
      - node plugins/claude-code/scripts/sync-managed-client.mjs --check

  plugins:sync-claude-runtime:
    desc: "Reconcile active Claude marketplace and cache runtimes with this checkout"
    cmds:
      - node plugins/claude-code/scripts/sync-runtime.mjs --sync
      - node plugins/claude-code/scripts/sync-runtime.mjs --check

  test:plugin-release:
    desc: "Run the complete local validation gate for every supported plugin release"
    cmds:
      - node plugins/executor/scripts/sync-error-reporting.mjs --check
      - node plugins/codex/scripts/sync-executor-core.mjs --check
      - node plugins/claude-code/scripts/sync-managed-client.mjs --check
      - node --check plugins/executor/tests/unix-plugin-live-gateway-canary.mjs
      - node --check plugins/executor/tests/windows-managed-client-canary.mjs
      - node --check plugins/executor/tests/windows-managed-client-route-canary.mjs
      - node --check plugins/executor/tests/windows-managed-client-live-gateway-canary.mjs
      - node --check plugins/executor/tests/windows-plugin-browser-onboarding-canary.mjs
      - node --check plugins/executor/tests/plugin-adoption-telemetry-canary.mjs
      - node --test plugins/executor/tests/*.test.mjs
      - node --test plugins/codex/tests/*.test.mjs
      - node --test plugins/claude-code/tests/*.test.mjs
      - node --test plugins/cursor/tests/*.test.mjs
      - npm test --prefix plugins/pi
      - npm test --prefix plugins/opencode
      - npm test --prefix plugins/omx
      - bash plugins/codex/tests/tool-policy.test.sh
      - bash plugins/codex/tests/mcp-proxy-handshake.test.sh
      - bash plugins/claude-code/tests/bash-discernment.test.sh
      - bash -n plugins/codex/hook.sh plugins/codex/client-id.sh plugins/codex/mcp-proxy.sh
      - bash -n plugins/claude-code/hook.sh plugins/claude-code/client-id.sh plugins/claude-code/mcp-proxy.sh plugins/claude-code/setup.sh
      - bash -n plugins/cursor/hook.sh plugins/cursor/mcp-proxy.sh
      - git diff --check

  test:plugin-production-canary:unix:
    desc: "Exercise every Unix plugin transport against the production gateway without mutating workflow state"
    preconditions:
      - sh: '[ -n "${STATEWRIGHT_API_KEY:-}" ]'
        msg: "STATEWRIGHT_API_KEY must contain the isolated production canary credential"
      - sh: '[ -n "${STATEWRIGHT_GATEWAY_URL:-}" ]'
        msg: "STATEWRIGHT_GATEWAY_URL must identify the production MCP gateway"
    env:
      STATEWRIGHT_PLUGIN_PRODUCTION_CANARY: "1"
      STATEWRIGHT_NO_UPDATE_CHECK: "1"
    cmds:
      - node plugins/executor/tests/unix-plugin-live-gateway-canary.mjs codex
      - node plugins/executor/tests/unix-plugin-live-gateway-canary.mjs claude
      - node plugins/executor/tests/unix-plugin-live-gateway-canary.mjs cursor
      - npm test --prefix plugins/pi -- --run src/production-gateway-canary.test.ts
      - npm test --prefix plugins/opencode -- --run src/production-gateway-canary.test.ts
      - npm test --prefix plugins/omx -- --run src/production-gateway-canary.test.ts

  canary:plugin-version:
    desc: "Dispatch a macOS/Linux source or release-artifact production canary at an explicit trusted ref"
    requires:
      vars: [REF, PLUGIN]
    vars:
      MODE: '{{default "source" .MODE}}'
    preconditions:
      - sh: 'printf "%s" "{{.PLUGIN}}" | grep -Eq "^(codex|claude|cursor|pi|opencode|omx)$"'
        msg: "PLUGIN must be codex, claude, cursor, pi, opencode, or omx"
      - sh: 'printf "%s" "{{.MODE}}" | grep -Eq "^(source|release-artifact)$"'
        msg: "MODE must be source or release-artifact"
    cmds:
      - gh workflow run plugin-version-canary.yml --ref main -f release_ref="{{.REF}}" -f plugin="{{.PLUGIN}}" -f evidence_mode="{{.MODE}}"

  canary:plugin-version:windows:
    desc: "Dispatch the Windows managed-client and production canary at an explicit trusted ref"
    requires:
      vars: [REF]
    cmds:
      - gh workflow run windows-plugin-canary.yml --ref main -f release_ref="{{.REF}}"

  test:claude-routing:
    desc: "Run Claude managed-proxy and loopback bridge routing tests"
    cmds:
      - node --test plugins/claude-code/tests/managed-routing.test.mjs plugins/executor/tests/managed-mcp-bridge.test.mjs

  test:plugin-transport-parity:
    desc: "Verify client-local MCP features survive direct, managed, and adapter transports"
    cmds:
      - node --test plugins/executor/tests/proxy-feature-parity.test.mjs

  test:control-plane-audit:
    desc: "Validate the host capability inventory and standalone hosted-routing fixtures; not live approval conformance"
    cmds:
      - node --test plugins/executor/tests/control-plane-capability-contract.test.mjs plugins/executor/tests/app-server-handoff-proxy.test.mjs

  test:codex-native-approvals:
    desc: "Validate standalone Codex approval parking, authorization, journaling, and native proxy release"
    cmds:
      - node --test plugins/executor/tests/human-approval.test.mjs plugins/executor/tests/approval-journal.test.mjs plugins/executor/tests/codex-approval-gate.test.mjs plugins/executor/tests/runtime-approval-service.test.mjs plugins/executor/tests/codex-native-approval-proxy.test.mjs plugins/executor/tests/codex-app-server-transport.test.mjs
      - git diff --check

  test:codex-native-approvals:vendor:
    desc: "Exercise installed vendor Codex approval protocol without inference or real workflow decisions"
    preconditions:
      - sh: '[ -n "${CODEX_BIN:-}" ]'
        msg: "Set CODEX_BIN to the vendor binary, not codex/ascodex shims"
    cmds:
      - node plugins/executor/tests/codex-native-approval-vendor-canary.mjs

  test:claude-setup:
    desc: "Verify Claude setup preserves endpoint selection and removes only legacy Statewright MCP"
    cmds:
      - bash plugins/claude-code/tests/setup.test.sh

  test:telemetry-contract:
    desc: "Verify gateway run binding, opt-in legacy logs, and provider token telemetry"
    cmds:
      - bash plugins/executor/tests/legacy-capture-contract.test.sh
      - bash plugins/executor/tests/hook-capture-dispatch.test.sh
      - node --test plugins/claude-code/tests/transcript-telemetry.test.mjs plugins/codex/tests/local-telemetry-agent.test.mjs plugins/codex/tests/orchestrator.test.mjs
      - "{{.CARGO}} test -p statewright-mcp-gateway state_snapshot_exposes_gateway_run_session_identity"

  test:
    desc: "Run all workspace tests"
    cmds:
      - "{{.CARGO}} test --workspace"

  test:approval-auth:
    desc: "Check engine and gateway approval contracts"
    cmds:
      - "{{.CARGO}} test -p statewright-engine -p statewright-mcp-gateway --no-default-features --lib"

  build:
    desc: "Build all binaries"
    cmds:
      - "{{.CARGO}} build"

  reset:calc:
    desc: "Reset buggy-calc fixture"
    cmds:
      - |
        cat > crates/cli/fixtures/buggy-calc/calc.py << 'EOF'
        """Simple calculator module."""


        def add(a, b):
            return a + b


        def subtract(a, b):
            return a - b


        def multiply(a, b):
            return a * b


        def divide(a, b):
            if b == 0:
                raise ValueError("Cannot divide by zero")
            return a // b


        def percentage(value, total):
            """Calculate what percentage 'value' is of 'total'."""
            if total == 0:
                raise ValueError("Total cannot be zero")
            return (value / total) * 100
        EOF
      - rm -rf crates/cli/fixtures/buggy-calc/__pycache__
      - echo "buggy-calc fixture reset"

  release:
    desc: "Tag and push a gateway release (triggers gateway CI, crate publish, and cross-arch binaries)"
    preconditions:
      - sh: '[ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]'
        msg: "Releases must be from main branch"
      - sh: '[ -z "$(git status --porcelain)" ]'
        msg: "Working directory must be clean"
    vars:
      NEXT_VERSION:
        sh: |
          LATEST=$(git tag -l 'gateway-v[0-9]*' | sed 's/gateway-v//' | sort -V | tail -1)
          if [ -z "$LATEST" ]; then echo "gateway-v1.0.0"; else
            major=${LATEST%%.*}
            remainder=${LATEST#*.}
            minor=${remainder%%.*}
            patch=${remainder##*.}
            echo "gateway-v${major}.${minor}.$((patch + 1))"
          fi
    cmds:
      - "{{.CARGO}} test --workspace"
      - echo "Tagging {{.NEXT_VERSION}}..."
      - git tag -a {{.NEXT_VERSION}} -m "Release {{.NEXT_VERSION}}"
      - git push origin main --tags
      - echo "Release {{.NEXT_VERSION}} pushed. CI will publish crates and build binaries."

  run:bugfix:
    desc: "Run bug-fix demo (OLLAMA_URL, MODEL, MODE, FIXTURE)"
    vars:
      OLLAMA_URL: '{{default "http://localhost:11434/v1" .OLLAMA_URL}}'
      MODEL: '{{default "gemma4:31b" .MODEL}}'
      MODE: '{{default "raw" .MODE}}'
      FIXTURE: '{{default "crates/cli/fixtures/buggy-calc" .FIXTURE}}'
    cmds:
      - |
        {{.CARGO}} run --bin sw-agent -- \
          --use-hardcoded-machine \
          --workdir "{{.FIXTURE}}" \
          --ollama-url "{{.OLLAMA_URL}}" \
          --model "{{.MODEL}}" \
          --tool-mode "{{.MODE}}" \
          --max-steps 20
