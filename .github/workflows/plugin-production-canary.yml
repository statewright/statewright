name: Plugin Production Canary

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Trusted main commit or tag to exercise"
        required: true
        default: "main"
        type: string
      plugin:
        description: "Plugin transport to exercise"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - codex
          - claude
          - cursor
          - pi
          - opencode
          - omx
  push:
    branches: [main]
    paths:
      - ".github/workflows/plugin-production-canary.yml"
      - "plugins/capabilities.json"
      - "plugins/executor/**"
      - "plugins/codex/**"
      - "plugins/claude-code/**"
      - "plugins/cursor/**"
      - "plugins/pi/**"
      - "plugins/opencode/**"
      - "plugins/omx/**"
      - "crates/mcp-gateway/**"
      - "self-hosted/pocketbase/pb_hooks/**"
      - "self-hosted/pocketbase/pb_migrations/**"
  schedule:
    - cron: "23 13 * * 1"

permissions:
  contents: read

jobs:
  production-gateway:
    name: ${{ matrix.plugin }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        plugin: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.plugin != 'all' && format('["{0}"]', inputs.plugin) || '["codex","claude","cursor","pi","opencode","omx"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
      - name: Require source from trusted main history
        run: |
          git merge-base --is-ancestor HEAD origin/main || {
            echo "The selected release_ref is not part of trusted main history." >&2
            exit 1
          }
      - name: Resolve canary source identity
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            plugins/executor/package-lock.json
            plugins/pi/package-lock.json
            plugins/opencode/package-lock.json
            plugins/omx/package-lock.json
      - name: Install executor dependencies
        run: npm ci --ignore-scripts --prefix plugins/executor
      - name: Install plugin dependencies
        if: matrix.plugin == 'pi' || matrix.plugin == 'opencode' || matrix.plugin == 'omx'
        run: npm ci --ignore-scripts --prefix plugins/${{ matrix.plugin }}
      - name: Run production gateway canary
        env:
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_GATEWAY_URL: https://mcp.statewright.ai
          STATEWRIGHT_PLUGIN_PRODUCTION_CANARY: "1"
          STATEWRIGHT_NO_UPDATE_CHECK: "1"
        run: |
          test -n "$STATEWRIGHT_API_KEY" || { echo "STATEWRIGHT_PLUGIN_CANARY_API_KEY is required." >&2; exit 1; }
          case "${{ matrix.plugin }}" in
            codex|claude|cursor)
              node plugins/executor/tests/unix-plugin-live-gateway-canary.mjs "${{ matrix.plugin }}"
              ;;
            pi)
              npm test --prefix plugins/pi -- --run src/production-gateway-canary.test.ts
              ;;
            opencode)
              npm test --prefix plugins/opencode -- --run src/production-gateway-canary.test.ts
              ;;
            omx)
              npm test --prefix plugins/omx -- --run src/production-gateway-canary.test.ts
              ;;
          esac
      - name: Submit plugin adoption telemetry event
        env:
          PLUGIN: ${{ matrix.plugin }}
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_PB_URL: https://statewright.ai
          STATEWRIGHT_PLUGIN_PRODUCTION_CANARY: "1"
        run: |
          version=$(node -p "require('./plugins/capabilities.json').plugins[process.env.PLUGIN].version")
          node plugins/executor/tests/plugin-adoption-telemetry-canary.mjs "$PLUGIN" "$version"
      - name: Record verification boundary
        if: always()
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            printf '%s\n' '## Plugin production canary boundary' ''
            printf -- '- Plugin: `%s`\n' '${{ matrix.plugin }}'
            printf -- '- Runner: `%s`\n' '${{ matrix.os }}'
            printf -- '- Requested ref: `%s`\n' "$REQUESTED_REF"
            printf -- '- Resolved source SHA: `%s`\n\n' "$SOURCE_SHA"
            printf '%s\n' 'This trusted-run-only job authenticates a dedicated isolated canary account to `mcp.statewright.ai`. Codex, Claude Code, and Cursor exercise MCP initialization, `tools/list`, and `statewright_get_status` through their actual stdio proxies. Pi and standalone OMX exercise initialization plus `statewright_get_status` through their direct clients. OpenCode relays `statewright_get_status` through its initialized executor-owned adapter bridge.' ''
            printf '%s\n' 'The secret is step-scoped and this workflow has no pull-request trigger. The selected source must resolve inside trusted `main` history before the secret-bearing steps run. The transport check is read-only. The following step submits one bounded `ci_canary` adoption event and requires an explicit endpoint acknowledgement. This proves source-transport compatibility and endpoint acceptance on macOS and Linux; it does not claim database persistence, a packaged artifact, provider-token usage, or an authenticated interactive vendor session.'
          } >> "$GITHUB_STEP_SUMMARY"
