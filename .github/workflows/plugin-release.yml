name: Plugin Release

on:
  push:
    tags:
      - "codex-v*"
      - "claude-v*"

permissions:
  actions: read
  contents: read

jobs:
  credential-helper:
    name: Credential helper (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: statewright-credentials-linux-x64
            source: target/x86_64-unknown-linux-gnu/release/statewright-credentials
          - os: macos-14
            target: aarch64-apple-darwin
            asset: statewright-credentials-darwin-arm64
            source: target/aarch64-apple-darwin/release/statewright-credentials
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            asset: statewright-credentials-windows-x64.exe
            source: target/x86_64-pc-windows-msvc/release/statewright-credentials.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux Secret Service headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Test native credential helper
        run: cargo test --target "${{ matrix.target }}" -p statewright-credentials
      - name: Build native credential helper
        run: cargo build --release --target "${{ matrix.target }}" -p statewright-credentials
      - name: Prepare credential helper asset
        shell: bash
        run: |
          mkdir -p credential-helper
          cp '${{ matrix.source }}' 'credential-helper/${{ matrix.asset }}'
      - uses: actions/upload-artifact@v4
        with:
          name: credential-helper-${{ matrix.asset }}
          path: credential-helper/${{ matrix.asset }}
          if-no-files-found: error

  native-desktop-launcher:
    if: startsWith(github.ref_name, 'codex-v')
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            platform: darwin-x64
          - target: aarch64-apple-darwin
            platform: darwin-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build native Desktop launcher
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          cargo build --release --target "$TARGET" -p statewright-native-desktop-launcher
      - name: Stage native Desktop launcher
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: cp "target/$TARGET/release/statewright-native-desktop-launcher" "statewright-native-desktop-launcher-$PLATFORM"
      - uses: actions/upload-artifact@v4
        with:
          name: native-desktop-launcher-${{ matrix.platform }}
          path: statewright-native-desktop-launcher-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [credential-helper, native-desktop-launcher]
    if: always() && needs.credential-helper.result == 'success' && (startsWith(github.ref_name, 'claude-v') || needs.native-desktop-launcher.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    outputs:
      archive: ${{ steps.plugin.outputs.archive }}
      directory: ${{ steps.plugin.outputs.directory }}
      notes_path: ${{ steps.plugin.outputs.notes_path }}
      plugin: ${{ steps.plugin.outputs.plugin }}
      release_name: ${{ steps.plugin.outputs.release_name }}
      source_sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.plugin.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Require exact-commit hosted canaries
        uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        with:
          script: |
            const { requirePluginCanaries } = require("./.github/scripts/require-plugin-canaries.cjs")
            await requirePluginCanaries({
              github,
              context,
              core,
              sourceSha: process.env.SOURCE_SHA,
            })
      - name: Resolve plugin
        id: plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            codex-v*)
              raw=${TAG#codex-v}; version=${raw%%-r*}
              echo 'plugin=codex' >> "$GITHUB_OUTPUT"
              echo 'directory=plugins/codex' >> "$GITHUB_OUTPUT"
              echo "archive=statewright-codex-$version.zip" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "release_name=Statewright Codex plugin $version" >> "$GITHUB_OUTPUT"
              echo "notes_path=docs/releases/codex-$version.md" >> "$GITHUB_OUTPUT"
              ;;
            claude-v*)
              raw=${TAG#claude-v}; version=${raw%%-r*}
              echo 'plugin=claude' >> "$GITHUB_OUTPUT"
              echo 'directory=plugins/claude-code' >> "$GITHUB_OUTPUT"
              echo "archive=statewright-claude-code-$version.zip" >> "$GITHUB_OUTPUT"
              echo "version=$version" >> "$GITHUB_OUTPUT"
              echo "release_name=Statewright Claude Code plugin $version" >> "$GITHUB_OUTPUT"
              echo "notes_path=docs/releases/claude-$version.md" >> "$GITHUB_OUTPUT"
              ;;
            *) exit 1 ;;
          esac
      - name: Verify plugin version matches tag
        env:
          DIRECTORY: ${{ steps.plugin.outputs.directory }}
          EXPECTED: ${{ steps.plugin.outputs.version }}
        run: |
          if [ "$DIRECTORY" = "plugins/codex" ]; then
            actual=$(node -p "require('./$DIRECTORY/.codex-plugin/plugin.json').version.split('+')[0]")
          else
            actual=$(node -p "require('./$DIRECTORY/plugin.json').version")
          fi
          test "$actual" = "$EXPECTED"
          test -f "${{ steps.plugin.outputs.notes_path }}"
      - name: Install plugin dependencies
        if: steps.plugin.outputs.directory == 'plugins/codex'
        run: npm ci --ignore-scripts --prefix plugins/codex
      - name: Download native credential helpers
        uses: actions/download-artifact@v4
        with:
          pattern: credential-helper-*
          path: ${{ steps.plugin.outputs.directory }}/bin
          merge-multiple: true
      - name: Mark Unix credential helpers executable
        run: chmod 0755 "${{ steps.plugin.outputs.directory }}/bin/statewright-credentials-linux-x64" "${{ steps.plugin.outputs.directory }}/bin/statewright-credentials-darwin-arm64"
      - name: Install Task
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.39.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run plugin contract tests
        env:
          DIRECTORY: ${{ steps.plugin.outputs.directory }}
        run: |
          node --test plugins/executor/tests/license-metadata.test.mjs
          node --test plugins/executor/tests/plugin-release-workflow.test.mjs
          if [ "$DIRECTORY" = "plugins/codex" ]; then
            node --test plugins/codex/tests/*.test.mjs
            bash -n plugins/codex/hook.sh plugins/codex/client-id.sh plugins/codex/mcp-proxy.sh
          else
            node --test plugins/claude-code/tests/*.test.mjs
            bash -n plugins/claude-code/hook.sh plugins/claude-code/client-id.sh plugins/claude-code/mcp-proxy.sh plugins/claude-code/setup.sh
          fi
      - name: Download native Desktop launchers
        if: steps.plugin.outputs.directory == 'plugins/codex'
        uses: actions/download-artifact@v4
        with:
          pattern: native-desktop-launcher-*
          path: ${{ runner.temp }}/native-desktop-launchers
          merge-multiple: true
      - name: Add native Desktop launchers to Codex plugin
        if: steps.plugin.outputs.directory == 'plugins/codex'
        run: |
          for platform in darwin-x64 darwin-arm64; do
            mkdir -p "plugins/codex/native/$platform"
            install -m 0755 "$RUNNER_TEMP/native-desktop-launchers/statewright-native-desktop-launcher-$platform" "plugins/codex/native/$platform/statewright-native-desktop-launcher"
          done
      - name: Package plugin
        env:
          ARCHIVE: ${{ steps.plugin.outputs.archive }}
          DIRECTORY: ${{ steps.plugin.outputs.directory }}
        run: |
          cp plugins/LICENSE.md "$DIRECTORY/LICENSE.md"
          zip -r "$ARCHIVE" "$DIRECTORY" -x '*/node_modules/*' '*/.DS_Store'
      - name: Attest release candidate provenance
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.plugin.outputs.archive }}
      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release-candidate
          path: ${{ steps.plugin.outputs.archive }}
          if-no-files-found: error
          retention-days: 1

  artifact-smoke:
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/executor/package-lock.json
      - name: Install canary runner dependencies
        run: npm ci --ignore-scripts --prefix plugins/executor
      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: plugin-release-candidate
          path: ${{ runner.temp }}/release
      - name: Unpack release candidate
        id: candidate
        env:
          ARCHIVE: ${{ needs.package.outputs.archive }}
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-candidate"
          unzip -q "$RUNNER_TEMP/release/$ARCHIVE" -d "$RUNNER_TEMP/plugin-candidate"
          digest=$(shasum -a 256 "$RUNNER_TEMP/release/$ARCHIVE" | awk '{print $1}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify packaged native Desktop launchers
        if: needs.package.outputs.plugin == 'codex'
        run: |
          test -x "$RUNNER_TEMP/plugin-candidate/plugins/codex/native/darwin-x64/statewright-native-desktop-launcher"
          test -x "$RUNNER_TEMP/plugin-candidate/plugins/codex/native/darwin-arm64/statewright-native-desktop-launcher"
      - name: Smoke packaged plugin against production
        env:
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_GATEWAY_URL: https://mcp.statewright.ai
          STATEWRIGHT_PLUGIN_PRODUCTION_CANARY: "1"
          STATEWRIGHT_NO_UPDATE_CHECK: "1"
          STATEWRIGHT_PLUGIN_ROOT: ${{ runner.temp }}/plugin-candidate
        run: |
          test -n "$STATEWRIGHT_API_KEY" || { echo "STATEWRIGHT_PLUGIN_CANARY_API_KEY is required." >&2; exit 1; }
          node plugins/executor/tests/unix-plugin-live-gateway-canary.mjs "${{ needs.package.outputs.plugin }}"
      - name: Submit packaged plugin adoption telemetry event
        env:
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_PB_URL: https://statewright.ai
          STATEWRIGHT_PLUGIN_PRODUCTION_CANARY: "1"
        run: node plugins/executor/tests/plugin-adoption-telemetry-canary.mjs "${{ needs.package.outputs.plugin }}" "${{ needs.package.outputs.version }}"
      - name: Record packaged-artifact evidence
        if: always()
        env:
          ARCHIVE: ${{ needs.package.outputs.archive }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
          SOURCE_SHA: ${{ needs.package.outputs.source_sha }}
        run: |
          {
            printf '%s\n' '## Packaged plugin production smoke' ''
            printf -- '- Archive: `%s`\n' "$ARCHIVE"
            printf -- '- SHA-256: `%s`\n' "$DIGEST"
            printf -- '- Source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Runner: `%s`\n' '${{ matrix.os }}'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [package, artifact-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified release candidate
        uses: actions/download-artifact@v4
        with:
          name: plugin-release-candidate
      - name: Publish plugin release
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ needs.package.outputs.release_name }}"
          body_path: "${{ needs.package.outputs.notes_path }}"
          files: "${{ needs.package.outputs.archive }}"
