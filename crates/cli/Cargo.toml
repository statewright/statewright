[package]
name = "statewright-cli"
description = "State machine agent executor — direct-to-Ollama agent loop with guardrails"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[lib]
name = "statewright_cli"
path = "src/lib.rs"

[[bin]]
name = "sw-agent"
path = "src/main.rs"

[dependencies]
statewright-engine = { version = "0.1.0", path = "../engine" }
statewright-agent = { version = "0.1.0", path = "../agent" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json"] }
clap = { version = "4", features = ["derive"] }
similar = "2"
libc = "0.2"
