name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p statewright-engine --no-verify || true
          sleep 30
          cargo publish -p statewright-agent --no-verify || true
          sleep 30
          cargo publish -p statewright-cli --no-verify || true
          cargo publish -p statewright-tui --no-verify || true
          sleep 30
          cargo publish -p statewright-mcp-gateway --no-verify || true

  binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: statewright-gateway_linux_amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: statewright-gateway_linux_arm64
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            name: statewright-gateway_darwin_amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: statewright-gateway_darwin_arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (cross)
        if: matrix.use_cross
        run: |
          cross build --release --target ${{ matrix.target }} -p statewright-mcp-gateway --features vendored-openssl
          cp target/${{ matrix.target }}/release/statewright-gateway ${{ matrix.name }}
          zip ${{ matrix.name }}.zip ${{ matrix.name }}

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: |
          cargo build --release --target ${{ matrix.target }} -p statewright-mcp-gateway
          cp target/${{ matrix.target }}/release/statewright-gateway ${{ matrix.name }}
          zip ${{ matrix.name }}.zip ${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: "*.zip"

  release:
    needs: [publish, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.zip"
