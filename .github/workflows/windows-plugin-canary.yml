name: Windows Plugin Canary

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Trusted main commit or tag to exercise"
        required: true
        default: "main"
        type: string
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/windows-plugin-canary.yml"
      - "plugins/capabilities.json"
      - "plugins/executor/**"
      - "plugins/codex/**"
      - "plugins/claude-code/**"
      - "plugins/cursor/**"

permissions:
  contents: read

jobs:
  managed-client-bootstrap:
    name: Codex and Claude managed-client bootstrap
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.sha }}
      - name: Require source from trusted main history
        if: github.event_name != 'pull_request'
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The selected release_ref is not part of trusted main history."
          }
      - name: Resolve canary source identity
        id: source
        run: |
          "sha=$(git rev-parse HEAD)" | Add-Content -Path $env:GITHUB_OUTPUT
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugins/executor/package-lock.json
      - name: Install executor dependencies
        run: npm ci --ignore-scripts --prefix plugins/executor
      - name: Install native host CLIs
        run: npm install --global @openai/codex @anthropic-ai/claude-code
      - name: Verify Codex CLI
        run: |
          codex --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Codex command: $((Get-Command codex).Source)"
      - name: Verify Claude CLI
        run: |
          claude --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Claude command: $((Get-Command claude).Source)"
      - name: Run managed-client bootstrap canary
        timeout-minutes: 3
        run: node plugins/executor/tests/windows-managed-client-canary.mjs
      - name: Run managed-client route canary
        timeout-minutes: 3
        run: node plugins/executor/tests/windows-managed-client-route-canary.mjs
      - name: Prove secretless browser onboarding
        timeout-minutes: 2
        env:
          STATEWRIGHT_API_KEY: ""
        run: node plugins/executor/tests/windows-plugin-browser-onboarding-canary.mjs
      - name: Run authenticated production gateway canary
        if: github.event_name != 'pull_request'
        env:
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_GATEWAY_URL: https://mcp.statewright.ai
        run: node plugins/executor/tests/windows-managed-client-live-gateway-canary.mjs

      - name: Probe authenticated vendor CLI feasibility
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          STATEWRIGHT_CANARY_CODEX_AUTH_JSON: ${{ secrets.STATEWRIGHT_CANARY_CODEX_AUTH_JSON }}
          STATEWRIGHT_CANARY_OPENAI_API_KEY: ${{ secrets.STATEWRIGHT_CANARY_OPENAI_API_KEY }}
          STATEWRIGHT_CANARY_CLAUDE_OAUTH_TOKEN: ${{ secrets.STATEWRIGHT_CANARY_CLAUDE_OAUTH_TOKEN }}
          STATEWRIGHT_CANARY_ANTHROPIC_API_KEY: ${{ secrets.STATEWRIGHT_CANARY_ANTHROPIC_API_KEY }}
        run: node plugins/executor/tests/windows-cli-auth-canary.mjs
      - name: Submit Codex adoption telemetry event
        if: github.event_name != 'pull_request'
        env:
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_PB_URL: https://statewright.ai
          STATEWRIGHT_PLUGIN_PRODUCTION_CANARY: "1"
        run: |
          $codexVersion = node -p "require('./plugins/capabilities.json').plugins.codex.version"
          node plugins/executor/tests/plugin-adoption-telemetry-canary.mjs codex $codexVersion
      - name: Submit Claude adoption telemetry event
        if: github.event_name != 'pull_request'
        env:
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_PB_URL: https://statewright.ai
          STATEWRIGHT_PLUGIN_PRODUCTION_CANARY: "1"
        run: |
          $claudeVersion = node -p "require('./plugins/capabilities.json').plugins.claude.version"
          node plugins/executor/tests/plugin-adoption-telemetry-canary.mjs claude $claudeVersion
      - name: Record verification boundary
        if: always()
        env:
          REQUESTED_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref_name }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          @"
          ## Windows plugin canary boundary

          - Requested ref: ``$env:REQUESTED_REF``
          - Resolved source SHA: ``$env:SOURCE_SHA``
          "@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          @'
          This job proves that a Windows-hosted Codex and Claude installation is discovered by the Statewright managed-client bootstrap, receives callable Windows shims, and is enabled in Statewright configuration. It executes the real npm-installed `codex.cmd` and `claude.cmd` launchers through the managed supervisor, then verifies fresh PowerShell profile activation, explicit cmd.exe PATH activation, and native-command restoration after uninstall.

          It also proves that the managed supervisor can run a Windows .cmd launcher through a deterministic Codex route/restart cycle while preserving the quoted route configuration, full continuation prompt, bridge, managed identity, and control-directory lifecycle. Codex, Claude Code, and Cursor exercise their secretless PowerShell browser-launch path.

          On trusted `main` pushes and manual dispatches, it also authenticates the executor-owned loopback bridge to production and performs MCP initialization, `tools/list`, and the non-mutating `statewright_get_status` call. Separate steps then submit bounded Codex and Claude Code `ci_canary` adoption events and require explicit endpoint acknowledgements. A manual source must resolve inside trusted `main` history before the secret-bearing steps run. Pull requests exercise only secretless bootstrap and routing. The key is scoped to production-only steps and is never exposed to a child host process.

          It also probes authenticated vendor CLI feasibility: with step-scoped repository secrets it executes a minimal non-interactive `codex exec` / `claude -p` turn against the vendor CLIs installed on the runner. A vendor whose credentials are not provisioned is reported as `not_provisioned` in the receipt without failing the job; a provisioned vendor whose turn fails does fail the job, because that is actionable infeasibility evidence. This still does not claim an interactive vendor session or a Statewright-gated approval loop on Windows; those require an interactive runner and human acceptance.
          '@ | Add-Content -Path $env:GITHUB_STEP_SUMMARY
