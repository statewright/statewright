name: Plugin Version Canary

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Trusted main commit or plugin release tag to exercise"
        required: true
        type: string
      plugin:
        description: "Plugin transport to exercise"
        required: true
        type: choice
        options:
          - codex
          - claude
          - cursor
          - pi
          - opencode
          - omx
      evidence_mode:
        description: "Exercise source at the ref or an existing GitHub release ZIP"
        required: true
        default: source
        type: choice
        options:
          - source
          - release-artifact

permissions:
  attestations: read
  contents: read

jobs:
  version-canary:
    name: ${{ inputs.plugin }} ${{ inputs.evidence_mode }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Check out current canary control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: control
          ref: main
      - name: Resolve and authorize requested source
        id: source
        env:
          EVIDENCE_MODE: ${{ inputs.evidence_mode }}
          PLUGIN: ${{ inputs.plugin }}
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          git -C control fetch --force --tags origin +refs/heads/main:refs/remotes/origin/main
          source_sha=$(git -C control rev-parse "${RELEASE_REF}^{commit}") || {
            echo "release_ref does not resolve to a commit." >&2
            exit 1
          }
          git -C control merge-base --is-ancestor "$source_sha" origin/main || {
            echo "release_ref is not part of trusted main history." >&2
            exit 1
          }
          if [ "$EVIDENCE_MODE" = "release-artifact" ]; then
            case "$PLUGIN:$RELEASE_REF" in
              codex:codex-v*) ;;
              claude:claude-v*) ;;
              *)
                echo "release-artifact mode currently supports only matching codex-v* and claude-v* releases." >&2
                exit 1
                ;;
            esac
          fi
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Check out requested source
        if: inputs.evidence_mode == 'source'
        uses: actions/checkout@v4
        with:
          path: target
          ref: ${{ steps.source.outputs.sha }}
      - name: Download requested release artifact
        if: inputs.evidence_mode == 'release-artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          RELEASE_REF: ${{ inputs.release_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/plugin-candidate"
          case "$PLUGIN" in
            codex) pattern='statewright-codex-*.zip' ;;
            claude) pattern='statewright-claude-code-*.zip' ;;
          esac
          gh release download "$RELEASE_REF" --repo "$GITHUB_REPOSITORY" --pattern "$pattern" --dir "$RUNNER_TEMP/release"
          set -- "$RUNNER_TEMP"/release/*.zip
          test "$#" -eq 1 && test -f "$1" || {
            echo "Expected exactly one matching release ZIP." >&2
            exit 1
          }
          gh attestation verify "$1" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/plugin-release.yml" \
            --source-digest "$SOURCE_SHA" \
            --source-ref "refs/tags/$RELEASE_REF" \
            --deny-self-hosted-runners
          unzip -q "$1" -d "$RUNNER_TEMP/plugin-candidate"
          digest=$(shasum -a 256 "$1" | awk '{print $1}')
          echo "ARTIFACT_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "STATEWRIGHT_PLUGIN_ROOT=$RUNNER_TEMP/plugin-candidate" >> "$GITHUB_ENV"
      - name: Select source plugin root
        if: inputs.evidence_mode == 'source'
        run: echo "STATEWRIGHT_PLUGIN_ROOT=$GITHUB_WORKSPACE/target" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: control/plugins/executor/package-lock.json
      - name: Install canary runner dependencies
        run: npm ci --ignore-scripts --prefix control/plugins/executor
      - name: Install source plugin dependencies
        if: inputs.evidence_mode == 'source' && (inputs.plugin == 'pi' || inputs.plugin == 'opencode' || inputs.plugin == 'omx')
        run: npm ci --ignore-scripts --prefix "$STATEWRIGHT_PLUGIN_ROOT/plugins/${{ inputs.plugin }}"
      - name: Run requested production canary
        env:
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_GATEWAY_URL: https://mcp.statewright.ai
          STATEWRIGHT_PLUGIN_PRODUCTION_CANARY: "1"
          STATEWRIGHT_NO_UPDATE_CHECK: "1"
        run: |
          test -n "$STATEWRIGHT_API_KEY" || { echo "STATEWRIGHT_PLUGIN_CANARY_API_KEY is required." >&2; exit 1; }
          case "${{ inputs.plugin }}" in
            codex|claude|cursor)
              node control/plugins/executor/tests/unix-plugin-live-gateway-canary.mjs "${{ inputs.plugin }}"
              ;;
            pi|opencode|omx)
              test "${{ inputs.evidence_mode }}" = source || exit 1
              npm test --prefix "$STATEWRIGHT_PLUGIN_ROOT/plugins/${{ inputs.plugin }}" -- --run src/production-gateway-canary.test.ts
              ;;
          esac
      - name: Submit requested plugin adoption telemetry event
        env:
          PLUGIN: ${{ inputs.plugin }}
          STATEWRIGHT_API_KEY: ${{ secrets.STATEWRIGHT_PLUGIN_CANARY_API_KEY }}
          STATEWRIGHT_PB_URL: https://statewright.ai
          STATEWRIGHT_PLUGIN_PRODUCTION_CANARY: "1"
        run: node control/plugins/executor/tests/plugin-adoption-telemetry-canary.mjs "$PLUGIN"
      - name: Record version evidence
        if: always()
        env:
          ARTIFACT_DIGEST: ${{ env.ARTIFACT_DIGEST }}
          RELEASE_REF: ${{ inputs.release_ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            printf '%s\n' '## Plugin version canary' ''
            printf -- '- Plugin: `%s`\n' '${{ inputs.plugin }}'
            printf -- '- Evidence mode: `%s`\n' '${{ inputs.evidence_mode }}'
            printf -- '- Requested ref: `%s`\n' "$RELEASE_REF"
            printf -- '- Resolved source SHA: `%s`\n' "$SOURCE_SHA"
            printf -- '- Artifact SHA-256: `%s`\n' "${ARTIFACT_DIGEST:-not-applicable}"
            printf -- '- Runner: `%s`\n\n' '${{ matrix.os }}'
            printf '%s\n' 'The production transport check is read-only. A following step submits one bounded `ci_canary` event for the exercised plugin version and requires an explicit endpoint acknowledgement. Source mode executes trusted source at the resolved SHA. Release-artifact mode executes the downloaded Codex or Claude ZIP. It does not prove database persistence, provider-token usage, or an authenticated interactive vendor-host session.'
          } >> "$GITHUB_STEP_SUMMARY"
