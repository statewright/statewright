version: '3'

vars:
  PLUGIN_VERSION:
    sh: jq -r '.version' plugin.json
  CACHE_DIR: "{{.HOME}}/.claude/plugins/cache/statewright/statewright/{{.PLUGIN_VERSION}}"

tasks:
  sync:
    desc: "Copy plugin files to local Claude Code cache"
    cmds:
      - cp hook.sh "{{.CACHE_DIR}}/hook.sh"
      - cp capture.sh "{{.CACHE_DIR}}/capture.sh"
      - cp mcp-proxy.sh "{{.CACHE_DIR}}/mcp-proxy.sh"
      - cp settings.json "{{.CACHE_DIR}}/settings.json"
      - cp -r skills/statewright/ "{{.CACHE_DIR}}/skills/statewright/"
      - cp -r hooks/ "{{.CACHE_DIR}}/hooks/"
      - echo "Synced v{{.PLUGIN_VERSION}} to cache"
      - echo "Run /reload-plugins in Claude Code"
