[package]
name = "statewright-mcp-gateway"
description = "MCP proxy server enforcing state machine guardrails on LLM agent tool access"
version.workspace = true
edition.workspace = true
license = "FSL-1.1-ALv2"
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "statewright-gateway"
path = "src/main.rs"

[features]
default = []
metering = ["dep:sqlx"]

[dependencies]
statewright-engine = { path = "../engine" }
statewright-agent = { path = "../agent", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v5"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"], optional = true }
tokio-stream = "0.1"
tower = "0.5"
http-body-util = "0.1"
